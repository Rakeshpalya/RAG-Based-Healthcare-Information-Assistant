name: AI-Healthcare-Agent Production CI/CD Pipeline

on:
  push:
    branches: [ main, master, release/* ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ENVIRONMENT: test
  HOST: 0.0.0.0
  PORT: 8000
  RAG_TOP_K: 5
  RAG_SIMILARITY_THRESHOLD: 0.25
  RAG_LATENCY_P95_BUDGET_MS: 3500.0
  DEBUG: "false"
  SAFE_LOG_MODE: "true"
  REDIS_ENABLED: "false"
  GEMINI_API_KEY: "test-mock-ci-key"
  SUPABASE_URL: "https://mock-supabase-ci-test.supabase.co"
  SUPABASE_PUBLISHABLE_KEY: "mock-supabase-publishable-key-for-ci-testing"

jobs:
  # ============================================================================
  # Stage 1: Validation, Invariant Checks, Multi-Phase Tests & Security Audit
  # ============================================================================
  test-and-audit:
    name: Lint, Test Suites & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgomp1 curl

      - name: 1. Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: 2. Syntax and Import Validation
        run: |
          python -m compileall backend tests
          python -c "import backend.main; import backend.config; print('All backend modules imported successfully.')"

      - name: 3. Verify Baseline Vector Store Invariants
        run: |
          python -c "
          import json, faiss
          idx = faiss.read_index('data/vector_store/index.faiss')
          meta = json.load(open('data/vector_store/metadata.json', 'r', encoding='utf-8'))
          print(f'FAISS vectors: {idx.ntotal} | Metadata records: {len(meta[\"records\"])} | Dimension: {idx.d}')
          assert idx.ntotal == 744, f'Expected 744 vectors, found {idx.ntotal}'
          assert len(meta['records']) == 744, f'Expected 744 records, found {len(meta[\"records\"])}'
          assert idx.d == 384, f'Expected 384 dimension, found {idx.d}'
          print('Baseline vector store invariants verified.')
          "

      - name: 4. Run Unit Tests
        run: |
          pytest -v tests/test_auth_service.py tests/test_chunking_service.py tests/test_database.py

      - name: 5. Run Phase 2 & 2F Retrieval Hardening Tests
        run: |
          pytest -v tests/test_phase2_retrieval_hardening.py tests/test_phase2f_retrieval_hardening.py

      - name: 6. Run Phase 3.2 & 3.3 Reliability, Cache & Citation Tests
        run: |
          pytest -v tests/test_phase3_2_reliability.py tests/test_phase3_3_cache.py tests/test_phase3_3_prewarm.py tests/test_phase3_3_streaming.py tests/test_phase3_citation_enforcement.py tests/test_phase3_grounded_prompt.py tests/test_phase3_hallucination_protection.py

      - name: 7. Run Phase 3.4 Production Hardening Tests
        run: |
          pytest -v tests/test_phase3_4_auth_isolation.py tests/test_phase3_4_cache_invalidation.py tests/test_phase3_4_concurrency.py tests/test_phase3_4_e2e.py tests/test_phase3_4_health_degradation.py tests/test_phase3_4_medical_safety.py tests/test_phase3_4_observability_metrics.py tests/test_phase3_4_security.py

      - name: 8. Run Phase 3.5 Distributed Infrastructure Tests
        run: |
          pytest -v tests/test_phase3_5_redis_cache.py tests/test_phase3_5_distributed_rate_limiter.py tests/test_phase3_5_metrics.py tests/test_phase3_5_snapshot.py tests/test_phase3_5_embeddings.py tests/test_phase3_5_redis_degradation.py tests/test_phase3_5_multi_instance.py tests/test_phase3_5_e2e.py

      - name: 9. Run Phase 3.6 Deployment & Reliability Tests
        run: |
          pytest -v tests/test_phase3_6_ci.py tests/test_phase3_6_docker.py tests/test_phase3_6_backup_restore.py tests/test_phase3_6_disaster_recovery.py tests/test_phase3_6_llm_resilience.py tests/test_phase3_6_security.py tests/test_phase3_6_release.py

      - name: 10. Run Full Security & Credential Audit Tests
        run: |
          pytest -v tests/test_phase9_secret_audit.py tests/test_phase9_config.py tests/test_phase8_security.py

      - name: 11. Re-Verify Vector Store Invariant Post-Testing
        run: |
          python -c "
          import json, faiss
          idx = faiss.read_index('data/vector_store/index.faiss')
          meta = json.load(open('data/vector_store/metadata.json', 'r', encoding='utf-8'))
          print(f'Post-eval FAISS: {idx.ntotal} | Meta: {len(meta[\"records\"])}')
          assert idx.ntotal == 744, 'Vector store was mutated during CI run!'
          assert len(meta['records']) == 744, 'Metadata store was mutated during CI run!'
          print('Post-eval vector store invariant strictly preserved at 744/744.')
          "

  # ============================================================================
  # Stage 2: Docker Build & Production Container Validation
  # ============================================================================
  docker-validation:
    name: Dockerfile & Multi-Container Validation
    needs: test-and-audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: 12. Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 13. Build Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ai-healthcare-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 14. Verify Non-Root User & Security Context
        run: |
          USER_ID=$(docker run --rm ai-healthcare-agent:latest id -u)
          echo "Container runtime UID: $USER_ID"
          test "$USER_ID" = "10001" || { echo "Container must run as non-root user (10001)"; exit 1; }

      - name: 15. Run Container & Test Health Probes
        run: |
          docker run -d --name test_api \
            -p 8000:8000 \
            -e ENVIRONMENT=production \
            -e HOST=0.0.0.0 \
            -e PORT=8000 \
            -e SAFE_LOG_MODE=true \
            -e DEBUG=false \
            -e SUPABASE_URL=https://mock-supabase-ci-test.supabase.co \
            -e SUPABASE_PUBLISHABLE_KEY=mock-supabase-publishable-key-for-ci-testing \
            ai-healthcare-agent:latest

          echo "Waiting for container startup..."
          sleep 5

          echo "Querying GET /health/live..."
          curl -f http://localhost:8000/health/live

          echo "Querying GET /health/ready..."
          curl -f http://localhost:8000/health/ready

          echo "Checking container logs for credentials or secrets..."
          docker logs test_api
          ! docker logs test_api 2>&1 | grep -iE "(password|secret|ai_za|bearer)"

          docker stop test_api
          docker rm test_api
          echo "Docker container verification completed successfully."
